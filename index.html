async function exportStockExcel(){
  if(typeof ExcelJS === 'undefined'){ showToast('⚠ The spreadsheet library failed to load. Check your internet connection and try again.'); return; }
  const wb = new ExcelJS.Workbook();
  wb.creator = settings.shopName || 'Workshop Ledger';
  wb.created = new Date();
  wb.title = 'Stock List Export';
  wb.subject = 'Inventory';

  const numCols = XL_COLS.length + 1; // + Total Value formula column
  const cols = XL_COLS.concat([{header:'Total Value', key:'value', width:16}]);

  const ws = wb.addWorksheet('Stock List', {views:[{state:'frozen', ySplit:4}]});
  ws.columns = cols.map(c=>({width:c.width}));

  const dateStr = new Date().toLocaleDateString('en-GB',{day:'2-digit',month:'short',year:'numeric'});
  xlStyleTitleRow(ws, 1, `📦 ${settings.shopName || 'Workshop Ledger'} — STOCK LIST (as of ${dateStr})`, numCols);
  xlStyleSubtitleRow(ws, 2, 'This is a live snapshot of everything in your stock list. "Total Value" is a formula (Quantity × Cost Price) — it will recalculate automatically if you edit numbers in Excel. Rows shown in red have quantity at or below their low-stock alert level.', numCols);
  ws.getRow(3).height = 6;

  ws.getRow(4).values = cols.map(c=>c.header);
  xlStyleHeaderRow(ws, 4, numCols);
  ws.autoFilter = {from:{row:4, column:1}, to:{row:4, column:numCols}};

  let r = 5;
  const categoriesSeen = new Set();
  const sortedInventory = [...inventory].sort((a,b)=>{
    const catA = (a.category || 'General').toLowerCase();
    const catB = (b.category || 'General').toLowerCase();
    if(catA !== catB) return catA.localeCompare(catB);
    return String(a.name||'').toLowerCase().localeCompare(String(b.name||'').toLowerCase());
  });
  let lastCategory = null;
  sortedInventory.forEach(item=>{
    const cat = item.category || 'General';
    categoriesSeen.add(cat);
    const isNewGroup = cat !== lastCategory;
    const firstRowOfItem = r;
    if(item.hasSizes){
      (item.variants||[]).forEach((v, idx)=>{
        ws.getRow(r).values = [
          idx===0 ? item.name : '', idx===0 ? cat : '', item.unit,
          v.qty, v.costPrice, v.sellPrice, v.size, v.lowStock, v.barcode||'', {formula:`D${r}*E${r}`}
        ];
        xlStyleDataRow(ws, r, numCols, (r-4)%2===0);
        ws.getCell(r,5).numFmt = '"Rs"#,##0'; ws.getCell(r,6).numFmt = '"Rs"#,##0'; ws.getCell(r,10).numFmt = '"Rs"#,##0';
        r++;
      });
    } else {
      ws.getRow(r).values = [
        item.name, cat, item.unit, item.qty, item.costPrice, item.sellPrice, '', item.lowStock, item.barcode||'', {formula:`D${r}*E${r}`}
      ];
      xlStyleDataRow(ws, r, numCols, (r-4)%2===0);
      ws.getCell(r,5).numFmt = '"Rs"#,##0'; ws.getCell(r,6).numFmt = '"Rs"#,##0'; ws.getCell(r,10).numFmt = '"Rs"#,##0';
      r++;
    }
    if(isNewGroup && firstRowOfItem > 5){
      for(let c=1;c<=numCols;c++){
        const cell = ws.getCell(firstRowOfItem, c);
        cell.border = {...cell.border, top:{style:'medium', color:{argb:XL_COLOR.brass}}};
      }
    }
    lastCategory = cat;
  });
  const lastDataRow = r - 1;

  if(lastDataRow >= 5){
    ws.addConditionalFormatting({
      ref: `D5:D${lastDataRow}`,
      rules: [{
        type:'expression', formulae:[`D5<=H5`], priority:1,
        style:{fill:{type:'pattern', pattern:'solid', bgColor:{argb:XL_COLOR.lowStock}}, font:{color:{argb:XL_COLOR.lowText}, bold:true}}
      }]
    });
  }

  const totalRow = lastDataRow + 1;
  if(lastDataRow >= 5){
    ws.mergeCells(totalRow, 1, totalRow, 3);
    ws.getCell(totalRow, 1).value = 'TOTAL';
    ws.getCell(totalRow, 1).font = {bold:true, size:12, color:{argb:XL_COLOR.inkDark}};
    ws.getCell(totalRow, 4).value = {formula:`SUM(D5:D${lastDataRow})`};
    ws.getCell(totalRow, 10).value = {formula:`SUM(J5:J${lastDataRow})`};
    ws.getCell(totalRow, 10).numFmt = '"Rs"#,##0';
    for(let c=1;c<=numCols;c++){
      const cell = ws.getCell(totalRow, c);
      cell.font = cell.font || {bold:true};
      cell.font = {...cell.font, bold:true};
      cell.fill = {type:'pattern', pattern:'solid', fgColor:{argb:XL_COLOR.cream}};
      cell.border = {top:{style:'double', color:{argb:XL_COLOR.inkDark}}, bottom:{style:'thin', color:{argb:XL_COLOR.border}}, left:{style:'thin', color:{argb:XL_COLOR.border}}, right:{style:'thin', color:{argb:XL_COLOR.border}}};
    }
  }

  // Summary sheet — category subtotals via live formulas against the Stock List sheet
  const summary = wb.addWorksheet('Summary');
  summary.columns = [{width:24},{width:16},{width:18}];
  xlStyleTitleRow(summary, 1, `📊 ${settings.shopName || 'Workshop Ledger'} — SUMMARY`, 3);
  summary.getRow(2).values = ['Category', 'Total Quantity', 'Total Value'];
  xlStyleHeaderRow(summary, 2, 3);
  let sr = 3;
  const cats = Array.from(categoriesSeen).sort();
  cats.forEach(cat=>{
    summary.getRow(sr).values = [
      cat,
      {formula:`SUMIF('Stock List'!B5:B${lastDataRow},A${sr},'Stock List'!D5:D${lastDataRow})`},
      {formula:`SUMIF('Stock List'!B5:B${lastDataRow},A${sr},'Stock List'!J5:J${lastDataRow})`}
    ];
    xlStyleDataRow(summary, sr, 3, (sr%2===0));
    summary.getCell(sr,3).numFmt = '"Rs"#,##0';
    sr++;
  });
  summary.getRow(sr).values = ['GRAND TOTAL', {formula:`SUM(B3:B${sr-1})`}, {formula:`SUM(C3:C${sr-1})`}];
  for(let c=1;c<=3;c++){
    const cell = summary.getCell(sr, c);
    cell.font = {bold:true, color:{argb:XL_COLOR.inkDark}};
    cell.fill = {type:'pattern', pattern:'solid', fgColor:{argb:XL_COLOR.cream}};
    cell.border = {top:{style:'double', color:{argb:XL_COLOR.inkDark}}};
  }
  summary.getCell(sr,3).numFmt = '"Rs"#,##0';

  const buffer = await wb.xlsx.writeBuffer();
  xlDownloadBuffer(buffer, `stock-list-${new Date().toISOString().slice(0,10)}.xlsx`);
}

function findExcelCol(headerRow, aliases){
  for(let i=0;i<headerRow.length;i++){
    const h = String(headerRow[i]||'').trim().toLowerCase();
    if(!h) continue;
    if(aliases.some(a=>h.includes(a))) return i;
  }
  return -1;
}

let pendingImportItems = null;

function handleStockImportFile(file){
  if(!file) return;
  if(typeof XLSX === 'undefined'){ showToast('⚠ The Excel reader library failed to load. Check your internet connection and try again.'); return; }
  const reader = new FileReader();
  reader.onload = (e)=>{
    try{
      const data = new Uint8Array(e.target.result);
      const wb = XLSX.read(data, {type:'array'});
      const ws = wb.Sheets[wb.SheetNames[0]];
      const rows = XLSX.utils.sheet_to_json(ws, {header:1, raw:true, defval:''});
      if(rows.length < 2){ showToast('⚠ That file has no data rows'); return; }
      const header = rows[0];
      const col = {
        name: findExcelCol(header, ['product name','name']),
        category: findExcelCol(header, ['category']),
        qty: findExcelCol(header, ['quantity','qty']),
        cost: findExcelCol(header, ['cost price','cost']),
        sell: findExcelCol(header, ['sell price','sale price','sell']),
        size: findExcelCol(header, ['size']),
        barcode: findExcelCol(header, ['barcode']),
        unit: findExcelCol(header, ['unit']),
        low: findExcelCol(header, ['low stock','reorder'])
      };
      if(col.name===-1 || col.qty===-1 || col.cost===-1 || col.sell===-1){
        showToast('⚠ Could not find the Product name / quantity / cost price / sell price columns — use the template.');
        return;
      }
      const blocks = [];
      let current = null;
      for(let r=1;r<rows.length;r++){
        const row = rows[r];
        if(row.every(c=>String(c).trim()==='')) continue;
        const nameVal = col.name>-1 ? String(row[col.name]||'').trim() : '';
        const rowData = {
          qty: col.qty>-1 ? parseFloat(row[col.qty])||0 : 0,
          cost: col.cost>-1 ? parseFloat(row[col.cost])||0 : 0,
          sell: col.sell>-1 ? parseFloat(row[col.sell])||0 : 0,
          size: col.size>-1 ? String(row[col.size]||'').trim() : '',
          barcode: col.barcode>-1 ? String(row[col.barcode]||'').trim() : '',
          low: col.low>-1 && row[col.low]!=='' ? parseFloat(row[col.low]) : null
        };
        if(nameVal){
          current = {
            name: nameVal,
            category: col.category>-1 ? String(row[col.category]||'').trim() : '',
            unit: col.unit>-1 ? (String(row[col.unit]||'').trim()||'pcs') : 'pcs',
            rows: [rowData]
          };
          blocks.push(current);
        } else if(current){
          current.rows.push(rowData);
        }
      }
      if(blocks.length===0){ showToast('⚠ No products found in that file'); return; }
      const parsedItems = blocks.map(b=>{
        const anySize = b.rows.some(r=>r.size);
        if(anySize){
          return {
            name: b.name, category: b.category||'General', unit: b.unit, hasSizes:true,
            lowStock: (b.rows[0].low!=null ? b.rows[0].low : settings.lowStockDefault),
            variants: b.rows.map(r=>({size:r.size||'-', qty:r.qty, costPrice:r.cost, sellPrice:r.sell, lowStock:(r.low!=null?r.low:settings.lowStockDefault), barcode:r.barcode}))
          };
        } else {
          const r = b.rows[0];
          return {
            name: b.name, category: b.category||'General', unit: b.unit, hasSizes:false,
            qty:r.qty, costPrice:r.cost, sellPrice:r.sell, lowStock:(r.low!=null?r.low:settings.lowStockDefault), barcode:r.barcode
          };
        }
      });
      pendingImportItems = parsedItems;
      renderImportPreview(parsedItems);
    }catch(err){
      showToast('⚠ Could not read that file. Make sure it is a valid Excel/CSV file.');
    }
  };
  reader.readAsArrayBuffer(file);
}

function renderImportPreview(items){
  const wrap = document.getElementById('importPreviewWrap');
  if(!wrap) return;
  const totalUnits = items.reduce((s,i)=> s + (i.hasSizes ? i.variants.reduce((s2,v)=>s2+v.qty,0) : i.qty), 0);
  wrap.innerHTML = `
    <div style="background:var(--surface-2);border:1px solid var(--border);border-radius:10px;padding:16px;margin-bottom:16px;">
      <div class="panel-header" style="margin-bottom:10px;">
        <h3 style="font-size:16px;">Review Before Importing</h3>
        <button class="modal-close" onclick="cancelImport()">✕</button>
      </div>
      <p class="helper" style="margin-bottom:10px;">Found <strong>${items.length}</strong> product(s), <strong>${totalUnits}</strong> total units. This <strong>adds</strong> these as new items — if a product with the same name is already in your stock, importing again will create a duplicate rather than merging quantities. Review the list below, then confirm.</p>
      <div style="max-height:260px;overflow-y:auto;border:1px solid var(--border);border-radius:8px;margin-bottom:12px;">
        <table>
          <thead><tr><th>Product</th><th>Category</th><th>Size(s) / Qty</th><th>Cost</th><th>Sell</th></tr></thead>
          <tbody>
            ${items.map(i=>`
              <tr>
                <td>${escapeHtml(i.name)}</td>
                <td>${escapeHtml(i.category)}</td>
                <td>${i.hasSizes ? i.variants.map(v=>`${escapeHtml(v.size)}: ${v.qty}`).join(', ') : i.qty}</td>
                <td>${i.hasSizes ? money(i.variants[0].costPrice)+' (1st size)' : money(i.costPrice)}</td>
                <td>${i.hasSizes ? money(i.variants[0].sellPrice)+' (1st size)' : money(i.sellPrice)}</td>
              </tr>
            `).join('')}
          </tbody>
        </table>
      </div>
      <div style="display:flex;gap:10px;flex-wrap:wrap;">
        <button class="btn btn-primary" onclick="confirmImport()">✓ Import These ${items.length} Products</button>
        <button class="btn btn-outline" onclick="cancelImport()">Cancel</button>
      </div>
    </div>
  `;
}
function cancelImport(){
  pendingImportItems = null;
  const wrap = document.getElementById('importPreviewWrap');
  if(wrap) wrap.innerHTML = '';
}
async function confirmImport(){
  if(!pendingImportItems || pendingImportItems.length===0) return;
  pendingImportItems.forEach(i=>{ i.id = uid(); });
  inventory = inventory.concat(pendingImportItems);
  await saveKey('inventory', inventory);
  showToast(`✓ Imported ${pendingImportItems.length} products`);
  cancelImport();
  render('inventory');
}

        <button class="btn btn-outline btn-sm" onclick="lockAppNow()">🔒 Lock Now</button>
      </div>

      <hr class="stitch" style="margin:26px 0;">
      <h3 style="font-size:16px;margin-bottom:6px;">How to open this app</h3>
      <p class="helper" style="margin-bottom:6px;">This is a single file — no installation, no separate database, and no internet connection needed to use it day-to-day. On the PC, double-click the file to open it in Chrome/Edge. On the Samsung tablet, add it to the home screen (browser menu → "Add to Home screen") so it opens like an app with one tap.</p>
      <p class="helper" style="margin-bottom:12px;">Amounts are shown in Pakistani Rupees (Rs).</p>

      <hr class="stitch" style="margin:26px 0;">
      <h3 style="font-size:16px;margin-bottom:6px;">Camera scanning setup (important for tablet)</h3>
      <p class="helper" style="margin-bottom:6px;"><strong>Why the tablet camera doesn't open:</strong> phone/tablet browsers refuse camera access on files opened directly from storage (a "file://" address) — it's a security rule of the browser, not a bug in this app. The barcode number can always be typed in by hand as a fallback, but here's the real fix so scanning works properly:</p>
      <p class="helper" style="margin-bottom:6px;"><strong>Easiest fix (2 minutes, free, no technical setup):</strong> On the PC, go to <strong>netlify.com/drop</strong> in a browser, and drag this HTML file onto the page. It gives you a web address (like <em>https://something.netlify.app</em>) that hosts this exact file for free. Open that address on the tablet instead of the local file, add it to the home screen there, and the camera will work normally and ask for permission. Whenever you make future changes to the app, just drag the new file onto the same Netlify page again to update it.</p>
      <p class="helper" style="margin-bottom:6px;"><strong>Note:</strong> hosting it this way does not change how your data is stored — it still saves everything on each device separately (see Backup below), nothing is uploaded to Netlify or anywhere else.</p>
      <p class="helper" style="margin-bottom:12px;"><strong>If you already have stock/bills saved on the tablet under the old file:// version:</strong> that data won't automatically appear on the new web address, since the browser treats it as a separate location. Before switching, go to Backup below, download a backup <em>from the old version</em>, then open the new web address and use Restore from Backup there to bring everything across. Do this once and you're set.</p>
      <p class="helper" style="margin-bottom:12px;">If the camera still doesn't work on a particular device or browser after that, every scan screen also has a box to type the barcode number in by hand, so billing and inventory are never blocked.</p>

      <hr class="stitch" style="margin:26px 0;">
      <h3 style="font-size:16px;margin-bottom:6px;">Backup &amp; Restore</h3>
      <p class="helper" style="margin-bottom:12px;">Your data (stock, bills, returns/warranty claims) is saved on this device automatically. Download a backup file regularly anyway — keep it on a USB drive, email it to yourself, or save it to Google Drive. If this tablet is ever lost, damaged, or its browser data is cleared, this file is how you get everything back. A backup taken on the PC can be restored on the tablet and vice versa.</p>
      <div style="display:flex;gap:10px;flex-wrap:wrap;align-items:center;">
        <button class="btn btn-teal" onclick="downloadBackup()">⬇ Download Backup (.json)</button>
        <label class="btn btn-outline" style="margin:0;">
          ⬆ Restore from Backup
          <input type="file" accept="application/json" style="display:none;" onchange="restoreBackup(this.files[0])">
        </label>
      </div>
      <div class="helper" id="lastBackupNote" style="margin-top:8px;"></div>

      <hr class="stitch" style="margin:26px 0;">
      <p class="helper" style="margin-bottom:10px;">Note: reminders show up as alerts inside this app (on the Dashboard and Ledger tab) when you open it — there's no background notification outside the browser, so it's worth checking the app every couple of days.</p>

      <hr class="stitch" style="margin:26px 0;">
      <h3 style="font-size:16px;margin-bottom:10px;">Danger zone</h3>
      <p class="helper" style="margin-bottom:10px;">This will permanently erase all inventory and bill records from this device.</p>
      <button class="btn btn-danger" onclick="resetAllData()">Erase all data</button>
    </div>
  `;
  const lastBackup = localStorage.getItem(STORAGE_PREFIX + 'lastBackupAt');
  if(lastBackup){
    document.getElementById('lastBackupNote').textContent = 'Last backup downloaded: ' + new Date(lastBackup).toLocaleString();
  }
}
function downloadBackup(){
  const payload = {
    exportedAt: new Date().toISOString(),
    app: 'Workshop Ledger',
    version: 3,
    settings, inventory, bills, returns, orders
  };
  const blob = new Blob([JSON.stringify(payload, null, 2)], {type:'application/json'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  const dateTag = new Date().toISOString().slice(0,10);
  a.href = url;
  a.download = `workshop-ledger-backup-${dateTag}.json`;
  document.body.appendChild(a);
  a.click();
  a.remove();
  URL.revokeObjectURL(url);
  localStorage.setItem(STORAGE_PREFIX + 'lastBackupAt', new Date().toISOString());
  showToast('✓ Backup downloaded');
  renderSettings();
}
function restoreBackup(file){
  if(!file) return;
  if(!confirm('Restoring will replace all current inventory, bills and settings on this device with the backup file. Continue?')) return;
  const reader = new FileReader();
  reader.onload = async (e)=>{
    try{
      const data = JSON.parse(e.target.result);
      if(!data.inventory || !data.bills || !data.settings){ throw new Error('not a valid backup'); }
      settings = {...DEFAULT_SETTINGS, ...data.settings};
      inventory = data.inventory;
      bills = data.bills;
      returns = data.returns || [];
      orders = data.orders || [];
      bills.forEach(b=>{
        if(!b.payment){ b.payment = {status:'paid', method:'cash', amountPaid:b.total, amountDue:0, payments:[{date:b.date, amount:b.total, method:'cash'}], lastReminded:null}; }
      });
      saveKey('settings', settings);
      saveKey('inventory', inventory);
      saveKey('bills', bills);
      saveKey('returns', returns);
      saveKey('orders', orders);
      showToast('✓ Backup restored');
      render('dashboard');
    }catch(err){
      showToast('⚠ That file could not be read as a backup.');
    }
  };
  reader.readAsText(file);
}
async function saveSettingsForm(){
  settings.shopName = document.getElementById('s_name').value.trim() || DEFAULT_SETTINGS.shopName;
  settings.phone = document.getElementById('s_phone').value.trim();
  settings.address = document.getElementById('s_address').value.trim();
  settings.gstNumber = document.getElementById('s_gstnum').value.trim();
  settings.gstRate = parseFloat(document.getElementById('s_gstrate').value) || 0;
  settings.lowStockDefault = parseFloat(document.getElementById('s_lowdefault').value) || 0;
  settings.reminderIntervalDays = parseFloat(document.getElementById('s_reminderdays').value) || 2;
  await saveKey('settings', settings);
  showToast('✓ Settings saved');
  render('settings');
}
async function resetAllData(){
  if(!confirm('This will permanently delete ALL inventory, bills, return/warranty records, and order lists — on EVERY device connected to this shop, not just this one. Are you sure?')) return;
  if(!confirm('Really sure? This cannot be undone.')) return;
  inventory = [];
  bills = [];
  returns = [];
  orders = [];
  settings = {...DEFAULT_SETTINGS};
  await saveKey('inventory', inventory);
  await saveKey('bills', bills);
  await saveKey('returns', returns);
  await saveKey('orders', orders);
  await saveKey('settings', settings);
  showToast('All data erased');
  render('dashboard');
}

/* ================= APP LOCK ================= */
let appUnlocked = false;
let settingsConfirmed = false; // true once we've heard from the cloud (or given up waiting because we're offline)

function markSettingsConfirmed(){
  if(settingsConfirmed) return;
  settingsConfirmed = true;
  const input = document.getElementById('lockCodeInput');
  const btn = document.getElementById('lockUnlockBtn');
  const waitMsg = document.getElementById('lockWaitMsg');
  if(input) input.disabled = false;
  if(btn) btn.disabled = false;
  if(waitMsg) waitMsg.style.display = 'none';
  // if it turns out no code is set, don't make staff type anything — just open straight away
  if(!settings.accessCode){
    appUnlocked = true;
    document.getElementById('lock-overlay').style.display = 'none';
    render('dashboard');
  } else if(input){
    input.focus();
  }
}

function tryUnlock(){
  if(!settingsConfirmed) return; // guard: button/enter can't fire this until we actually know the real code
  const input = document.getElementById('lockCodeInput');
  const val = (input.value||'').trim();
  const correct = settings.accessCode ? String(settings.accessCode) : '';
  if(!correct || val === correct){
    appUnlocked = true;
    document.getElementById('lock-overlay').style.display = 'none';
    input.value = '';
    document.getElementById('lockError').textContent = '';
    render('dashboard');
  } else {
    document.getElementById('lockError').textContent = 'Wrong code. Try again.';
    input.value = '';
    input.focus();
  }
}
function lockAppNow(){
  appUnlocked = false;
  document.getElementById('lock-overlay').style.display = 'flex';
  const input = document.getElementById('lockCodeInput');
  input.value = '';
  document.getElementById('lockError').textContent = '';
  setTimeout(()=>input.focus(), 50);
}
async function saveAccessCode(){
  const val = document.getElementById('s_accessCode').value.trim();
  settings.accessCode = val;
  await saveKey('settings', settings);
  showToast(val ? '✓ Access code set' : '✓ Lock turned off');
}

/* ================= INIT ================= */
(async function init(){
  await loadAll();
  // The lock overlay is visible and disabled by default (see HTML). We never assume
  // "no code" just from the instantly-available local cache — that cache can be
  // stale or empty on a device that hasn't synced yet, which would wrongly let
  // someone straight in. We wait for the cloud to confirm the real code first,
  // and only fall back to the local cache if we're genuinely offline.
  setTimeout(markSettingsConfirmed, 5000); // offline fallback: stop waiting after 5s
})();
</script>
